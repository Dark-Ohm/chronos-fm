[workspace]
resolver = "2"
members = [
  "crates/chronos-fm",
  "crates/chronos-fm-core",
  "crates/chronos-fm-models",
  "crates/chronos-fm-services",
  "crates/chronos-fm-store",
  "crates/chronos-fm-ui",
  "crates/chronos-fm-pages",
]
# P2 以降に追加:
#   "crates/chronos-fm-launcher",
#   "crates/chronos-fm-plugin-host",
#   "crates/plugins/*"
exclude = ["web"]

# gpui renders with Metal/Blade and the GUI stack is only exercised on macOS, so
# Linux CI builds headless. `default-members` keeps bare `cargo build`/`test`/
# `clippy` to the toolkit-free crates; the GUI crates (chronos-fm-ui / chronos-fm-pages /
# chronos-fm) are still workspace members and build with `--workspace`, `-p`, or on
# macOS. This mirrors the previous single-crate `default = []` / `gui` feature.
default-members = [
  "crates/chronos-fm-core",
  "crates/chronos-fm-models",
  "crates/chronos-fm-services",
  "crates/chronos-fm-store",
]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/Dark-Ohm/chronos-fm"
homepage     = "https://chronos-fm.app"
authors      = ["chronos-fm contributors"]

[workspace.dependencies]
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
time               = { version = "0.3", features = ["formatting", "macros"] }

# Shared toolkit: ChronOS + Chronos-FM both path-depend on the local gpui-ce
# fork under ../Source (not crates.io / upstream zed). gpui-component is the
# longbridge UI kit fork also vendored there; its nested zed git deps are
# redirected via [patch] below so only one gpui graph is linked.
gpui = { path = "../Source/gpui" }
gpui_platform = { path = "../Source/gpui_platform" }
gpui-component = { path = "../Source/gpui-component/crates/ui" }

# gpui-component's workspace still declares gpui (and siblings) as
# git = zed-industries/zed. Without this patch Cargo would resolve two
# different `gpui` sources (path here vs git there) and fail to unify.
# Only packages that appear under that git source in our lock graph are listed
# (extra entries produce "patch was not used" warnings).
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../Source/gpui" }
gpui_platform = { path = "../Source/gpui_platform" }
gpui_macros = { path = "../Source/gpui_macros" }
gpui_web = { path = "../Source/gpui_web" }
gpui_shared_string = { path = "../Source/gpui_shared_string" }
gpui_linux = { path = "../Source/gpui_linux" }
gpui_wgpu = { path = "../Source/gpui_wgpu" }
gpui_collections = { path = "../Source/gpui_collections" }
gpui_scheduler = { path = "../Source/gpui_scheduler" }
gpui_sum_tree = { path = "../Source/gpui_sum_tree" }
gpui_refineable = { path = "../Source/gpui_refineable" }
gpui_derive_refineable = { path = "../Source/gpui_derive_refineable" }
gpui_media = { path = "../Source/gpui_media" }
gpui_util = { path = "../Source/gpui_util" }

[workspace.lints.rust]
unsafe_code  = "deny"
# Every public item must carry a doc comment (testing.md §3). Promoted to an
# error in CI by `-D warnings`; to be raised to "deny" in P7 (#48).
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "debuginfo"
