[workspace]
resolver = "2"
members = [
  "crates/chronos-fm",
  "crates/chronos-fm-core",
  "crates/chronos-fm-models",
  "crates/chronos-fm-services",
  "crates/chronos-fm-store",
  "crates/chronos-fm-ui",
  "crates/chronos-fm-pages",
]
# P2 以降に追加:
#   "crates/chronos-fm-launcher",
#   "crates/chronos-fm-plugin-host",
#   "crates/plugins/*"
exclude = ["web"]

# gpui renders with Metal/Blade and the GUI stack is only exercised on macOS, so
# Linux CI builds headless. `default-members` keeps bare `cargo build`/`test`/
# `clippy` to the toolkit-free crates; the GUI crates (chronos-fm-ui / chronos-fm-pages /
# chronos-fm) are still workspace members and build with `--workspace`, `-p`, or on
# macOS. This mirrors the previous single-crate `default = []` / `gui` feature.
default-members = [
  "crates/chronos-fm-core",
  "crates/chronos-fm-models",
  "crates/chronos-fm-services",
  "crates/chronos-fm-store",
]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/Dark-Ohm/chronos-fm"
homepage     = "https://chronos-fm.app"
authors      = ["chronos-fm contributors"]

[workspace.dependencies]
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
time               = { version = "0.3", features = ["formatting", "macros"] }

# Shared toolkit: ChronOS + Chronos-FM + Chronos-IDE all git-depend on the
# same pushed fork (github.com/Dark-Ohm/Chronos-GPUI), pinned to one rev —
# NOT a path-dep on a local sibling checkout. A path-dep on ../Source only
# builds on a machine that happens to have that exact sibling directory;
# a git-dep builds from any fresh clone anywhere. gpui-component is the
# longbridge UI kit fork, vendored in the same repo; its nested zed git deps
# are redirected via [patch] below so only one gpui graph is linked.
gpui = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_platform = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui-component = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }

# gpui-component's workspace still declares gpui (and siblings) as
# git = zed-industries/zed. Without this patch Cargo would resolve two
# different `gpui` sources (our fork here vs upstream zed there) and fail to
# unify. Only packages that appear under that git source in our lock graph
# are listed (extra entries produce "patch was not used" warnings).
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_platform = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_macros = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_web = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_shared_string = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_linux = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_wgpu = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_collections = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_scheduler = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_sum_tree = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_refineable = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_derive_refineable = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_media = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }
gpui_util = { git = "https://github.com/Dark-Ohm/Chronos-GPUI", rev = "ee80b72" }

[workspace.lints.rust]
unsafe_code  = "deny"
# Every public item must carry a doc comment (testing.md §3). Promoted to an
# error in CI by `-D warnings`; to be raised to "deny" in P7 (#48).
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "debuginfo"
