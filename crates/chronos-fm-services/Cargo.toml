[package]
name = "chronos-fm-services"
description = "Filesystem listing, search, and syntax-highlighting services for chronos-fm."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "chronos_fm_services"
path = "src/chronos_fm_services.rs"

[features]
# `syntax` produces gpui colors, so it (and its heavy syntect dependency) is
# gated behind `gui`. fs/search build without any UI toolkit.
gui = ["dep:gpui", "dep:syntect"]

[dependencies]
chronos-fm-core   = { path = "../chronos-fm-core" }
chronos-fm-models = { path = "../chronos-fm-models" }
anyhow.workspace  = true
serde.workspace   = true
tracing.workspace = true
time.workspace    = true
async-channel = "2"
postage = "0.5"
tantivy = "0.26"
ignore = "0.4"
grep = "0.4"
dirs = "6.0"
notify = "8"
notify-debouncer-mini = "0.7"
trash = "5"
gpui = { workspace = true, optional = true }
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }
zbus = "5.13.2"
async-trait = "0.1.91"
zip = "7.2.0"
tar = "0.4.46"
flate2 = "1.1.9"
zstd = "0.13.3"
lru = "0.18.2"
thiserror.workspace = true
xdg-mime = "0.4.0"
freedesktop-desktop-entry = "0.8.1"
gix = { version = "0.86.0", features = ["tree-editor"] }
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
# T039 gate 1: native file/directory picker for S3 transfer local source/
# destination selection. Version + feature set matches Source's own
# workspace pin (Source/Cargo.toml) so this resolves to the SAME already-
# locked ashpd/zbus instance pulled in transitively via gpui_linux/oo7,
# not a second copy — see T039 report's "no established native dialog
# dependency" open sub-decision.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[lints]
workspace = true
