name: CachyOS Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --user root
    steps:
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup clang lld vulkan-icd-loader \
            wayland wayland-protocols libxkbcommon libxcb libxkbcommon-x11 \
            xorg-server-xvfb
          rustup default stable
          rustup component add rustfmt clippy

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cargo.toml uses dev path deps to the sibling fork checkout (../Source).
      - name: Checkout fork (sibling ../Source)
        run: |
          git clone --depth 1 https://github.com/Dark-Ohm/Chronos-GPUI "$GITHUB_WORKSPACE/../Source"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: |
          export RUSTFLAGS="-C opt-level=3 -C lto=thin -C codegen-units=1 -C link-arg=-fuse-ld=lld"
          cargo build --release --locked -p chronos-fm

      - name: Smoke test
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            timeout 10 ./target/release/chronos-fm --version

      - name: Verify fork link
        run: |
          test -d "$GITHUB_WORKSPACE/../Source/gpui" \
            && echo "✅ GPUI fork linked at ../Source" \
            || (echo "❌ GPUI fork not found at ../Source" && exit 1)
          grep -q 'path = "../Source/' Cargo.toml \
            && echo "✅ path deps active" \
            || (echo "❌ expected path deps in Cargo.toml" && exit 1)

      - name: Upload binary artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: chronos-fm-linux-x86_64
          path: target/release/chronos-fm